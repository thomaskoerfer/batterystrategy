name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify tag matches integration version
        run: |
          version="$(jq -r '.version' custom_components/battery_strategy/manifest.json)"
          test "$GITHUB_REF_NAME" = "$version"
      - name: Build integration archive
        run: zip -r battery_strategy.zip custom_components/battery_strategy
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" battery_strategy.zip \
            --title "Battery Strategy $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
