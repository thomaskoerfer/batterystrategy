# Codex dry-run package: weather feed + strategy dry-run + recorder retention safeguards
rest:
  - resource: "https://api.open-meteo.com/v1/forecast?latitude=50.93396673835345&longitude=6.079473495483399&current=temperature_2m,cloud_cover,shortwave_radiation,wind_speed_10m&timezone=Europe%2FBerlin"
    scan_interval: 900
    sensor:
      - name: Open Meteo Temperature
        unique_id: codex_open_meteo_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        value_template: "{{ value_json.current.temperature_2m }}"
      - name: Open Meteo Cloud Cover
        unique_id: codex_open_meteo_cloud_cover
        unit_of_measurement: "%"
        state_class: measurement
        value_template: "{{ value_json.current.cloud_cover }}"
      - name: Open Meteo Shortwave Radiation
        unique_id: codex_open_meteo_shortwave_radiation
        unit_of_measurement: "W/m²"
        state_class: measurement
        value_template: "{{ value_json.current.shortwave_radiation }}"
      - name: Open Meteo Wind Speed
        unique_id: codex_open_meteo_wind_speed
        unit_of_measurement: "km/h"
        state_class: measurement
        value_template: "{{ value_json.current.wind_speed_10m }}"

command_line:
  - sensor:
      name: Battery Strategy Dryrun
      unique_id: codex_battery_strategy_dryrun
      command: "python3 /config/scripts/battery_strategy_dryrun.py"
      command_timeout: 180
      scan_interval: 300
      value_template: "{{ value_json.mode }}"
      json_attributes:
        - planned_mode
        - planned_power_w
        - planned_charge_power_w
        - planned_discharge_power_w
        - discharge_mode_detail
        - next_charge_window_start_ts
        - remaining_discharge_budget_kwh
        - expected_net_load_until_charge_kwh
        - required_discharge_power_w
        - slot_value_score
        - recommended_power_w
        - recommended_charge_power_w
        - recommended_discharge_power_w
        - reason
        - expected_spread_ct
        - rte_break_even_ct
        - load_forecast_next_1h_kwh
        - pv_forecast_raw_next_1h_kwh
        - pv_forecast_corrected_next_1h_kwh
        - net_load_forecast_next_1h_kwh
        - grid_import_forecast_next_1h_kwh
        - grid_export_forecast_next_1h_kwh
        - pv_surplus_avg_20m_w
        - pv_surplus_stable
        - grid_import_actual_now_w
        - grid_export_actual_now_w
        - grid_net_actual_now_w
        - house_load_actual_now_w
        - house_load_total_actual_now_w
        - wallbox_actual_now_w
        - pv_generation_actual_now_w
        - profile_today_pv_fc_power
        - profile_today_grid_import_fc_power
        - profile_today_grid_export_fc_power
        - profile_today_grid_net_fc_power
        - profile_tomorrow_pv_fc_power
        - profile_tomorrow_grid_import_fc_power
        - profile_tomorrow_grid_export_fc_power
        - profile_tomorrow_grid_net_fc_power
        - profile_48h_pv_fc_power
        - profile_48h_pv_actual_power
        - profile_48h_house_fc_power
        - profile_48h_house_actual_power
        - profile_48h_grid_import_fc_power
        - profile_48h_grid_export_fc_power
        - profile_48h_grid_net_fc_power
        - profile_48h_grid_net_actual_power
        - pv_surplus_now_w
        - heatpump_power_now_w
        - backtest_mae_pv_24h_kwh
        - backtest_mae_load_24h_kwh
        - backtest_mae_pv_7d_kwh
        - backtest_mae_load_7d_kwh
        - backtest_hit_rate_24h_pct
        - weather_factor
        - script_version
        - pv_bias
        - load_bias
        - pv_bias_slot_now
        - load_bias_slot_now
        - virtual_soc_start_pct
        - virtual_soc_end_tomorrow_pct
        - price_low_ct
        - price_high_ct
        - price_avg_ct
        - price_min_ct
        - price_max_ct
        - price_slot_median_ct
        - price_slot_q20_ct
        - price_slot_q80_ct
        - price_slot_rank
        - price_tomorrow_min_ct
        - price_tomorrow_min_rank
        - eex_base_today_ct
        - eex_peak_today_ct
        - eex_spread_today_ct
        - eex_trade_date_today
        - eex_base_tomorrow_ct
        - eex_peak_tomorrow_ct
        - eex_spread_tomorrow_ct
        - eex_trade_date_tomorrow
        - eex_base_day_after_ct
        - eex_peak_day_after_ct
        - eex_spread_day_after_ct
        - eex_trade_date_day_after
        - baseline_cost_today_eur
        - optimized_cost_today_eur
        - baseline_cost_tomorrow_eur
        - optimized_cost_tomorrow_eur
        - estimated_savings_today_eur
        - estimated_savings_tomorrow_eur
        - estimated_savings_cumulative_eur
        - actual_savings_today_eur
        - actual_savings_lifetime_eur
        - actual_battery_charge_grid_today_kwh
        - actual_battery_charge_pv_today_kwh
        - actual_battery_discharge_credited_today_kwh
        - actual_battery_charge_cost_today_eur
        - actual_battery_discharge_credit_today_eur
        - profile_today_price
        - profile_today_soc
        - profile_today_power
        - profile_today_charge_power
        - profile_today_discharge_power
        - profile_tomorrow_price
        - profile_tomorrow_soc
        - profile_tomorrow_power
        - profile_tomorrow_charge_power
        - profile_tomorrow_discharge_power
        - profile_48h_charge_fc_power
        - profile_48h_discharge_fc_power
        - timestamp

input_boolean:
  battery_strategy_kill_switch:
    name: Battery Strategy Kill Switch
    icon: mdi:power
    initial: off
  battery_strategy_suppress_charge_grid:
    name: Battery Strategy Suppress Charge Grid
    icon: mdi:transmission-tower-off
    initial: off
  battery_strategy_full_discharge:
    name: Battery Strategy Full Discharge
    icon: mdi:battery-arrow-down
    initial: off

input_number:
  battery_strategy_battery_input_baseline_kwh:
    name: Battery Strategy Battery Input Baseline kWh
    min: 0
    max: 100000
    step: 0.001
    mode: box
  battery_strategy_battery_output_baseline_kwh:
    name: Battery Strategy Battery Output Baseline kWh
    min: 0
    max: 100000
    step: 0.001
    mode: box

template:
  - binary_sensor:
      - name: Battery Strategy PV Follow Strong Export
        unique_id: codex_battery_strategy_pv_follow_strong_export
        state: >
          {% set residual = states('sensor.battery_strategy_residual_net_no_battery_no_ev') | float(0) %}
          {% set soc = states('sensor.hoa1nan7n331666_electriclevel') | float(100) %}
          {{ residual <= -200 and soc < 99 }}
      - name: Battery Strategy PV Follow Stable Export
        unique_id: codex_battery_strategy_pv_follow_stable_export
        delay_on: "00:00:45"
        delay_off: "00:01:30"
        state: >
          {% set residual = states('sensor.battery_strategy_residual_net_no_battery_no_ev') | float(0) %}
          {% set soc = states('sensor.hoa1nan7n331666_electriclevel') | float(100) %}
          {{ residual <= -60 and soc < 99 }}
  - sensor:
      - name: Battery Strategy Mode
        unique_id: codex_battery_strategy_mode
        state: >
          {% if is_state('input_boolean.battery_strategy_kill_switch', 'on') %}
            disabled
          {% else %}
          {% set base_mode = state_attr('sensor.battery_strategy_dryrun', 'mode') or states('sensor.battery_strategy_dryrun') %}
          {{ base_mode }}
          {% endif %}
      - name: Battery Strategy Planned Mode
        unique_id: codex_battery_strategy_planned_mode
        state: "{{ state_attr('sensor.battery_strategy_dryrun', 'planned_mode') or states('sensor.battery_strategy_dryrun') }}"
      - name: Battery Strategy Planned Power
        unique_id: codex_battery_strategy_planned_power
        unit_of_measurement: "W"
        state_class: measurement
        state: "{{ state_attr('sensor.battery_strategy_dryrun', 'planned_power_w') | float(0) }}"
      - name: Battery Strategy Planned Charge Power
        unique_id: codex_battery_strategy_planned_charge_power
        unit_of_measurement: "W"
        state_class: measurement
        state: "{{ state_attr('sensor.battery_strategy_dryrun', 'planned_charge_power_w') | float(0) }}"
      - name: Battery Strategy Planned Discharge Power
        unique_id: codex_battery_strategy_planned_discharge_power
        unit_of_measurement: "W"
        state_class: measurement
        state: "{{ state_attr('sensor.battery_strategy_dryrun', 'planned_discharge_power_w') | float(0) }}"
      - name: Battery Strategy Grid Import Live Power Now
        unique_id: codex_battery_strategy_grid_import_live_power_now
        unit_of_measurement: "W"
        state_class: measurement
        state: >
          {% set tibber = states('sensor.power_heerlener_strasse_300') | float(none) %}
          {% set tibber_age = (as_timestamp(now()) - as_timestamp(states.sensor.power_heerlener_strasse_300.last_updated, 0)) if states.sensor.power_heerlener_strasse_300 is not none else 1e9 %}
          {% set l1 = states('sensor.te31njn2n154582_l1_p') | float(none) %}
          {% set l2 = states('sensor.te31njn2n154582_l2_p') | float(none) %}
          {% set l3 = states('sensor.te31njn2n154582_l3_p') | float(none) %}
          {% set a1 = (as_timestamp(now()) - as_timestamp(states.sensor.te31njn2n154582_l1_p.last_updated, 0)) if states.sensor.te31njn2n154582_l1_p is not none else 1e9 %}
          {% set a2 = (as_timestamp(now()) - as_timestamp(states.sensor.te31njn2n154582_l2_p.last_updated, 0)) if states.sensor.te31njn2n154582_l2_p is not none else 1e9 %}
          {% set a3 = (as_timestamp(now()) - as_timestamp(states.sensor.te31njn2n154582_l3_p.last_updated, 0)) if states.sensor.te31njn2n154582_l3_p is not none else 1e9 %}
          {% set zendure_ok = l1 is not none and l2 is not none and l3 is not none and a1 < 120 and a2 < 120 and a3 < 120 %}
          {% if zendure_ok %}
            {{ [0, (l1 + l2 + l3)] | max | round(0) }}
          {% elif tibber is not none and tibber_age < 180 %}
            {{ [0, tibber] | max | round(0) }}
          {% else %}
            0
          {% endif %}
      - name: Battery Strategy Grid Export Live Power Now
        unique_id: codex_battery_strategy_grid_export_live_power_now
        unit_of_measurement: "W"
        state_class: measurement
        state: >
          {% set tibber = states('sensor.power_production_heerlener_strasse_300') | float(none) %}
          {% set tibber_age = (as_timestamp(now()) - as_timestamp(states.sensor.power_production_heerlener_strasse_300.last_updated, 0)) if states.sensor.power_production_heerlener_strasse_300 is not none else 1e9 %}
          {% set l1 = states('sensor.te31njn2n154582_l1_p') | float(none) %}
          {% set l2 = states('sensor.te31njn2n154582_l2_p') | float(none) %}
          {% set l3 = states('sensor.te31njn2n154582_l3_p') | float(none) %}
          {% set a1 = (as_timestamp(now()) - as_timestamp(states.sensor.te31njn2n154582_l1_p.last_updated, 0)) if states.sensor.te31njn2n154582_l1_p is not none else 1e9 %}
          {% set a2 = (as_timestamp(now()) - as_timestamp(states.sensor.te31njn2n154582_l2_p.last_updated, 0)) if states.sensor.te31njn2n154582_l2_p is not none else 1e9 %}
          {% set a3 = (as_timestamp(now()) - as_timestamp(states.sensor.te31njn2n154582_l3_p.last_updated, 0)) if states.sensor.te31njn2n154582_l3_p is not none else 1e9 %}
          {% set zendure_ok = l1 is not none and l2 is not none and l3 is not none and a1 < 120 and a2 < 120 and a3 < 120 %}
          {% if zendure_ok %}
            {{ [0, (-1 * (l1 + l2 + l3))] | max | round(0) }}
          {% elif tibber is not none and tibber_age < 180 %}
            {{ [0, tibber] | max | round(0) }}
          {% else %}
            0
          {% endif %}
      - name: Battery Strategy Grid Import Live Source
        unique_id: codex_battery_strategy_grid_import_live_source
        state: >
          {% set tibber = states('sensor.power_heerlener_strasse_300') | float(none) %}
          {% set tibber_age = (as_timestamp(now()) - as_timestamp(states.sensor.power_heerlener_strasse_300.last_updated, 0)) if states.sensor.power_heerlener_strasse_300 is not none else 1e9 %}
          {% set l1 = states('sensor.te31njn2n154582_l1_p') | float(none) %}
          {% set l2 = states('sensor.te31njn2n154582_l2_p') | float(none) %}
          {% set l3 = states('sensor.te31njn2n154582_l3_p') | float(none) %}
          {% set a1 = (as_timestamp(now()) - as_timestamp(states.sensor.te31njn2n154582_l1_p.last_updated, 0)) if states.sensor.te31njn2n154582_l1_p is not none else 1e9 %}
          {% set a2 = (as_timestamp(now()) - as_timestamp(states.sensor.te31njn2n154582_l2_p.last_updated, 0)) if states.sensor.te31njn2n154582_l2_p is not none else 1e9 %}
          {% set a3 = (as_timestamp(now()) - as_timestamp(states.sensor.te31njn2n154582_l3_p.last_updated, 0)) if states.sensor.te31njn2n154582_l3_p is not none else 1e9 %}
          {% set zendure_ok = l1 is not none and l2 is not none and l3 is not none and a1 < 120 and a2 < 120 and a3 < 120 %}
          {% if zendure_ok %}
            zendure_l123
          {% elif tibber is not none and tibber_age < 180 %}
            tibber
          {% else %}
            none
          {% endif %}
      - name: Battery Strategy Battery In Out Live Power
        unique_id: codex_battery_strategy_battery_in_out_live_power
        unit_of_measurement: "W"
        state_class: measurement
        state: >
          {% set out_pack = states('sensor.hoa1nan7n331666_outputpackpower') | float(none) %}
          {% set in_pack = states('sensor.hoa1nan7n331666_packinputpower') | float(none) %}
          {% set out_home = states('sensor.hoa1nan7n331666_outputhomepower') | float(none) %}
          {% set grid_in = states('sensor.hoa1nan7n331666_gridinputpower') | float(none) %}
          {% set a_out_pack = (as_timestamp(now()) - as_timestamp(states.sensor.hoa1nan7n331666_outputpackpower.last_updated, 0)) if states.sensor.hoa1nan7n331666_outputpackpower is not none else 1e9 %}
          {% set a_in_pack = (as_timestamp(now()) - as_timestamp(states.sensor.hoa1nan7n331666_packinputpower.last_updated, 0)) if states.sensor.hoa1nan7n331666_packinputpower is not none else 1e9 %}
          {% set a_out_home = (as_timestamp(now()) - as_timestamp(states.sensor.hoa1nan7n331666_outputhomepower.last_updated, 0)) if states.sensor.hoa1nan7n331666_outputhomepower is not none else 1e9 %}
          {% set a_grid_in = (as_timestamp(now()) - as_timestamp(states.sensor.hoa1nan7n331666_gridinputpower.last_updated, 0)) if states.sensor.hoa1nan7n331666_gridinputpower is not none else 1e9 %}
          {% set ac_mode = states('select.hoa1nan7n331666_acmode') | lower %}
          {% if 'output' in ac_mode %}
            {% if out_home is not none and a_out_home < 180 %}
              {{ [0, out_home] | max | round(0) }}
            {% elif in_pack is not none and a_in_pack < 180 %}
              {{ [0, in_pack] | max | round(0) }}
            {% elif grid_in is not none and a_grid_in < 180 %}
              {{ [0, grid_in] | max | round(0) }}
            {% else %}
              0
            {% endif %}
          {% elif 'input' in ac_mode %}
            {% if grid_in is not none and a_grid_in < 180 %}
              {{ (-1 * ([0, grid_in] | max)) | round(0) }}
            {% elif out_pack is not none and a_out_pack < 180 %}
              {{ (-1 * ([0, out_pack] | max)) | round(0) }}
            {% elif in_pack is not none and a_in_pack < 180 %}
              {{ (-1 * ([0, in_pack] | max)) | round(0) }}
            {% elif out_home is not none and a_out_home < 180 %}
              {{ (-1 * ([0, out_home] | max)) | round(0) }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}
      - name: Battery Strategy Recommended Power
        unique_id: codex_battery_strategy_recommended_power
        unit_of_measurement: "W"
        state_class: measurement
        state: >
          {% set effective_mode = states('sensor.battery_strategy_mode') %}
          {% set planned_charge = state_attr('sensor.battery_strategy_dryrun', 'planned_charge_power_w') | float(0) %}
          {% set planned_discharge = state_attr('sensor.battery_strategy_dryrun', 'planned_discharge_power_w') | float(0) %}
          {% set pv = states('sensor.solarmanpv_station_generationpower') | float(0) %}
          {% set gi = states('sensor.battery_strategy_grid_import_live_power_now') | float(0) %}
          {% set ge = states('sensor.battery_strategy_grid_export_live_power_now') | float(0) %}
          {% set wb = (states('sensor.wallbox_leistung') | float(0)) * 1000 %}
          {% set bat = states('sensor.battery_strategy_battery_in_out_live_power') | float(0) %}
          {% set house_total = [0, gi + pv + bat - ge] | max %}
          {% set house_wo_ev = [0, house_total - wb] | max %}
          {% set pv_surplus = [0, pv - house_wo_ev] | max %}
          {% set net_wo_ev = [0, gi - ge + bat - wb] | max %}
          {% if effective_mode == 'charge_follow' %}
            {{ [ [planned_charge, pv_surplus] | max, 2400 ] | min | round(0) }}
          {% elif effective_mode in ['charge_grid', 'charge_pv_surplus'] %}
            {{ [planned_charge, 2400] | min | round(0) }}
          {% elif effective_mode == 'discharge_push' %}
            {{ [net_wo_ev, 2400] | min | round(0) }}
          {% elif effective_mode == 'discharge_limited' %}
            {{ [planned_discharge, net_wo_ev, 2400] | min | round(0) }}
          {% else %}
            0
          {% endif %}
      - name: Battery Strategy Recommended Charge Power
        unique_id: codex_battery_strategy_recommended_charge_power
        unit_of_measurement: "W"
        state_class: measurement
        state: >
          {% set effective_mode = states('sensor.battery_strategy_mode') %}
          {% set planned = state_attr('sensor.battery_strategy_dryrun', 'planned_charge_power_w') | float(0) %}
          {% set pv = states('sensor.solarmanpv_station_generationpower') | float(0) %}
          {% set gi = states('sensor.battery_strategy_grid_import_live_power_now') | float(0) %}
          {% set ge = states('sensor.battery_strategy_grid_export_live_power_now') | float(0) %}
          {% set wb = (states('sensor.wallbox_leistung') | float(0)) * 1000 %}
          {% set bat = states('sensor.battery_strategy_battery_in_out_live_power') | float(0) %}
          {% set house_total = [0, gi + pv + bat - ge] | max %}
          {% set house_wo_ev = [0, house_total - wb] | max %}
          {% set pv_surplus = [0, pv - house_wo_ev] | max %}
          {% if effective_mode == 'charge_follow' %}
            {{ [ [planned, pv_surplus] | max, 2400 ] | min | round(0) }}
          {% elif effective_mode in ['charge_grid', 'charge_pv_surplus'] %}
            {{ [planned, 2400] | min | round(0) }}
          {% else %}
            0
          {% endif %}
      - name: Battery Strategy Recommended Discharge Power
        unique_id: codex_battery_strategy_recommended_discharge_power
        unit_of_measurement: "W"
        state_class: measurement
        state: >
          {% set effective_mode = states('sensor.battery_strategy_mode') %}
          {% set planned = state_attr('sensor.battery_strategy_dryrun', 'planned_discharge_power_w') | float(0) %}
          {% set gi = states('sensor.battery_strategy_grid_import_live_power_now') | float(0) %}
          {% set ge = states('sensor.battery_strategy_grid_export_live_power_now') | float(0) %}
          {% set wb_raw = states('sensor.wallbox_leistung') | float(0) %}
          {% set wb_status = states('sensor.wallbox_status') | lower %}
          {% set wb = (wb_raw * 1000) if ('charg' in wb_status) else 0 %}
          {% set bat = states('sensor.battery_strategy_battery_in_out_live_power') | float(0) %}
          {% set net_wo_ev = [0, gi - ge + bat - wb] | max %}
          {% if effective_mode == 'discharge_push' %}
            {{ [net_wo_ev, 2400] | min | round(0) }}
          {% elif effective_mode == 'discharge_limited' %}
            {{ [planned, net_wo_ev, 2400] | min | round(0) }}
          {% else %}
            0
          {% endif %}
      - name: Battery Strategy Residual Net No Battery No EV
        unique_id: codex_battery_strategy_residual_net_no_battery_no_ev
        unit_of_measurement: "W"
        state_class: measurement
        state: >
          {% set gi = states('sensor.battery_strategy_grid_import_live_power_now') | float(0) %}
          {% set ge = states('sensor.battery_strategy_grid_export_live_power_now') | float(0) %}
          {% set wb_raw = states('sensor.wallbox_leistung') | float(0) %}
          {% set wb_status = states('sensor.wallbox_status') | lower %}
          {% set wb = (wb_raw * 1000) if ('charg' in wb_status) else 0 %}
          {% set bat = states('sensor.battery_strategy_battery_in_out_live_power') | float(0) %}
          {{ (gi - ge + bat - wb) | round(0) }}
      - name: Battery Strategy Live Command Power
        unique_id: codex_battery_strategy_live_command_power
        unit_of_measurement: "W"
        state_class: measurement
        state: >
          {% if is_state('input_boolean.battery_strategy_kill_switch', 'on') %}
            0
          {% else %}
          {% set mode = state_attr('sensor.battery_strategy_dryrun', 'mode') or states('sensor.battery_strategy_dryrun') %}
          {% set planned_charge = state_attr('sensor.battery_strategy_dryrun', 'planned_charge_power_w') | float(0) %}
          {% set planned_discharge = state_attr('sensor.battery_strategy_dryrun', 'planned_discharge_power_w') | float(0) %}
          {% set residual = states('sensor.battery_strategy_residual_net_no_battery_no_ev') | float(0) %}
          {% set ge_live = states('sensor.battery_strategy_grid_export_live_power_now') | float(0) %}
          {% set cur_out = states('number.hoa1nan7n331666_outputlimit') | float(0) %}
          {% set pv_follow_fast = is_state('binary_sensor.battery_strategy_pv_follow_strong_export', 'on') or is_state('binary_sensor.battery_strategy_pv_follow_stable_export', 'on') %}
          {% set suppress_charge_grid = is_state('input_boolean.battery_strategy_suppress_charge_grid', 'on') %}
          {% set full_discharge = is_state('input_boolean.battery_strategy_full_discharge', 'on') %}
          {% if full_discharge and residual > 20 %}
            {% set p = [[0, residual] | max, 2400] | min %}
          {% elif full_discharge and residual < -60 %}
            {% set p = [[0, (-1 * residual) - 20] | max, 2400] | min %}
          {% elif full_discharge %}
            {% set p = 0 %}
          {% elif mode in ['idle', 'discharge_blocked'] and pv_follow_fast %}
            {% set p = [[0, (-1 * residual) - 20] | max, 2400] | min %}
          {% elif mode == 'charge_grid' and suppress_charge_grid and pv_follow_fast %}
            {% set p = [[0, (-1 * residual) - 20] | max, 2400] | min %}
          {% elif mode == 'charge_grid' and suppress_charge_grid %}
            {% set p = 0 %}
          {% elif mode == 'discharge_push' %}
            {% set raw = [[0, residual] | max, 2400] | min %}
            {% if ge_live >= 40 %}
              {% set p = raw %}
            {% elif raw < 20 and cur_out > 200 %}
              {% set p = cur_out %}
            {% elif ((raw - cur_out) | abs) < 20 %}
              {% set p = cur_out %}
            {% else %}
              {% set p = raw %}
            {% endif %}
          {% elif mode == 'discharge_limited' %}
            {% set raw = [planned_discharge, [0, residual] | max, 2400] | min %}
            {% if ge_live >= 40 %}
              {% set p = raw %}
            {% elif raw < 20 and cur_out > 200 %}
              {% set p = cur_out %}
            {% elif ((raw - cur_out) | abs) < 20 %}
              {% set p = cur_out %}
            {% else %}
              {% set p = raw %}
            {% endif %}
          {% elif mode == 'charge_follow' %}
            {% set pv_follow = [0, -1 * residual] | max %}
            {% set p = [[planned_charge, pv_follow] | max, 2400] | min %}
          {% elif mode in ['charge_grid', 'charge_pv_surplus'] %}
            {% set p = [[0, planned_charge] | max, 2400] | min %}
          {% else %}
            {% set p = 0 %}
          {% endif %}
          {{ (0 if p < 20 else p) | round(0) }}
          {% endif %}
      - name: Battery Strategy Live Command Mode
        unique_id: codex_battery_strategy_live_command_mode
        state: >
          {% if is_state('input_boolean.battery_strategy_kill_switch', 'on') %}
            idle
          {% else %}
          {% set mode = state_attr('sensor.battery_strategy_dryrun', 'mode') or states('sensor.battery_strategy_dryrun') %}
          {% set p = states('sensor.battery_strategy_live_command_power') | float(0) %}
          {% set residual = states('sensor.battery_strategy_residual_net_no_battery_no_ev') | float(0) %}
          {% set pv_follow_fast = is_state('binary_sensor.battery_strategy_pv_follow_strong_export', 'on') or is_state('binary_sensor.battery_strategy_pv_follow_stable_export', 'on') %}
          {% set suppress_charge_grid = is_state('input_boolean.battery_strategy_suppress_charge_grid', 'on') %}
          {% set full_discharge = is_state('input_boolean.battery_strategy_full_discharge', 'on') %}
          {% if p <= 0 %}
            idle
          {% elif full_discharge and residual > 20 %}
            output
          {% elif full_discharge and residual < -60 %}
            input
          {% elif mode == 'charge_grid' and suppress_charge_grid and pv_follow_fast %}
            input
          {% elif mode in ['idle', 'discharge_blocked'] and pv_follow_fast %}
            input
          {% elif mode in ['charge_follow', 'charge_grid', 'charge_pv_surplus'] %}
            input
          {% elif mode in ['discharge_push', 'discharge_limited'] %}
            output
          {% else %}
            idle
          {% endif %}
          {% endif %}
      - name: Battery Strategy Live Command Override Reason
        unique_id: codex_battery_strategy_live_command_override_reason
        state: >
          {% set mode = state_attr('sensor.battery_strategy_dryrun', 'mode') or states('sensor.battery_strategy_dryrun') %}
          {% set residual = states('sensor.battery_strategy_residual_net_no_battery_no_ev') | float(0) %}
          {% set pv_follow_fast = is_state('binary_sensor.battery_strategy_pv_follow_strong_export', 'on') or is_state('binary_sensor.battery_strategy_pv_follow_stable_export', 'on') %}
          {% if is_state('input_boolean.battery_strategy_full_discharge', 'on') and residual > 20 %}
            full_discharge_output
          {% elif is_state('input_boolean.battery_strategy_full_discharge', 'on') and residual < -60 %}
            full_discharge_pv_follow
          {% elif is_state('input_boolean.battery_strategy_full_discharge', 'on') %}
            full_discharge_idle
          {% elif mode == 'charge_grid' and is_state('input_boolean.battery_strategy_suppress_charge_grid', 'on') and pv_follow_fast %}
            charge_grid_suppressed_pv_follow
          {% elif mode == 'charge_grid' and is_state('input_boolean.battery_strategy_suppress_charge_grid', 'on') %}
            charge_grid_suppressed
          {% elif mode in ['idle', 'discharge_blocked'] and is_state('binary_sensor.battery_strategy_pv_follow_strong_export', 'on') %}
            pv_surplus_fast
          {% elif mode in ['idle', 'discharge_blocked'] and is_state('binary_sensor.battery_strategy_pv_follow_stable_export', 'on') %}
            pv_surplus_stable
          {% else %}
            none
          {% endif %}
      - name: Battery Strategy Discharge Mode Detail
        unique_id: codex_battery_strategy_discharge_mode_detail
        state: "{{ state_attr('sensor.battery_strategy_dryrun', 'discharge_mode_detail') or 'idle' }}"
