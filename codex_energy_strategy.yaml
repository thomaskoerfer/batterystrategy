              (states('sensor.battery_strategy_optimized_cost_today') | float(0))) | round(3) }}
      - name: Battery Strategy Savings Tomorrow Calc
        unique_id: codex_battery_strategy_savings_tomorrow_calc
        unit_of_measurement: "EUR"
        device_class: monetary
        state: >
          {{ ((states('sensor.battery_strategy_baseline_cost_tomorrow') | float(0)) -
              (states('sensor.battery_strategy_optimized_cost_tomorrow') | float(0))) | round(3) }}

recorder:
  db_url: !secret recorder_db_url
  auto_purge: true
  auto_repack: true
  purge_keep_days: 45
  exclude:
    domains:
      - updater
      - conversation
      - assist_satellite
      - image
      - camera
    entities:
      - sensor.battery_strategy_dryrun

automation:
  - id: codex_battery_strategy_startup_refresh
    alias: Codex Battery Strategy Startup Refresh
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:30"
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.battery_strategy_dryrun
      - delay: "00:01:00"
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.battery_strategy_dryrun

  - id: codex_battery_strategy_quarterhour_refresh
    alias: Codex Battery Strategy Quarter-Hour Refresh
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
        seconds: 0
    action:
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.battery_strategy_dryrun

  - id: codex_battery_strategy_energy_baseline_refresh
    alias: Codex Battery Strategy Energy Baseline Refresh
    mode: single
    trigger:
      - platform: time
        at: "00:00:10"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.battery_input') not in ['unknown','unavailable','none',''] }}
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.battery_strategy_battery_input_baseline_kwh
                data:
                  value: "{{ states('sensor.battery_input') | float(0) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.battery_output') not in ['unknown','unavailable','none',''] }}
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.battery_strategy_battery_output_baseline_kwh
                data:
                  value: "{{ states('sensor.battery_output') | float(0) }}"

  - id: codex_battery_strategy_full_discharge_auto_reset
    alias: Codex Battery Strategy Full Discharge Auto Reset
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.hoa1nan7n331666_electriclevel
        below: 5.6
      - platform: state
        entity_id:
          - input_boolean.battery_strategy_full_discharge
          - sensor.hoa1nan7n331666_electriclevel
          - number.hoa1nan7n331666_minsoc
    condition:
      - condition: state
        entity_id: input_boolean.battery_strategy_full_discharge
        state: "on"
      - condition: template
        value_template: >
          {% set soc = states('sensor.hoa1nan7n331666_electriclevel') | float(100) %}
          {% set min_soc = states('number.hoa1nan7n331666_minsoc') | float(5) %}
          {{ soc <= (min_soc + 0.5) }}
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.battery_strategy_full_discharge

  - id: codex_battery_strategy_live_actuation
    alias: Codex Battery Strategy Live Actuation
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_boolean.battery_strategy_kill_switch
          - input_boolean.battery_strategy_suppress_charge_grid
          - input_boolean.battery_strategy_full_discharge
          - sensor.battery_strategy_live_command_mode
          - sensor.battery_strategy_live_command_power
      - platform: time_pattern
        seconds: "/10"
    condition:
      - condition: template
        value_template: >
          {{ states('select.hoa1nan7n331666_acmode') not in ['unknown', 'unavailable', 'none'] and
             states('number.hoa1nan7n331666_inputlimit') not in ['unknown', 'unavailable'] and
             states('number.hoa1nan7n331666_outputlimit') not in ['unknown', 'unavailable'] }}
    action:
      - variables:
          target_mode: "{{ states('sensor.battery_strategy_live_command_mode') }}"
          target_power: "{{ states('sensor.battery_strategy_live_command_power') | float(0) | round(0) }}"
          current_mode: "{{ states('select.hoa1nan7n331666_acmode') }}"
          current_input: "{{ states('number.hoa1nan7n331666_inputlimit') | float(0) }}"
          current_output: "{{ states('number.hoa1nan7n331666_outputlimit') | float(0) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ target_mode == 'input' }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ current_mode != 'input' }}"
                    sequence:
                      - service: select.select_option
                        target:
                          entity_id: select.hoa1nan7n331666_acmode
                        data:
                          option: "Input mode"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >
                          {{ (current_input - target_power) | abs >= 20 and
                             (as_timestamp(now()) - as_timestamp(states.number.hoa1nan7n331666_inputlimit.last_changed, 0)) >= 15 }}
                    sequence:
                      - service: number.set_value
                        target:
                          entity_id: number.hoa1nan7n331666_inputlimit
                        data:
                          value: "{{ target_power }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ current_output > 0 }}"
                    sequence:
                      - service: number.set_value
                        target:
                          entity_id: number.hoa1nan7n331666_outputlimit
                        data:
                          value: 0
          - conditions:
              - condition: template
                value_template: "{{ target_mode == 'output' }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ current_mode != 'output' }}"
                    sequence:
                      - service: select.select_option
                        target:
                          entity_id: select.hoa1nan7n331666_acmode
                        data:
                          option: "Output mode"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >
                          {{ (current_output - target_power) | abs >= 20 and
                             (as_timestamp(now()) - as_timestamp(states.number.hoa1nan7n331666_outputlimit.last_changed, 0)) >= 15 }}
                    sequence:
                      - service: number.set_value
                        target:
                          entity_id: number.hoa1nan7n331666_outputlimit
                        data:
                          value: "{{ target_power }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ current_input > 0 }}"
                    sequence:
                      - service: number.set_value
                        target:
                          entity_id: number.hoa1nan7n331666_inputlimit
                        data:
                          value: 0
        default:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_input > 0 }}"
                sequence:
                  - service: number.set_value
                    target:
                      entity_id: number.hoa1nan7n331666_inputlimit
                    data:
                      value: 0
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_output > 0 }}"
                sequence:
                  - service: number.set_value
                    target:
                      entity_id: number.hoa1nan7n331666_outputlimit
                    data:
                      value: 0
