name: Feature request
description: Propose a strategy, hardware, forecast, or usability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Use case
      description: Describe the household behavior or decision the feature should improve.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Explain expected inputs, outputs, safety constraints, and fallback behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
